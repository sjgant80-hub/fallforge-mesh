name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests
        run: node --test kernel.test.mjs
      - name: mutation gate — kernel.mjs must be CLEAN
        run: |
          node tools/witness.mjs mutate kernel.mjs --timeout 30000 --cap 500 --test node --test kernel.test.mjs | tee gate.out || true
          node -e "const b=require('fs').readFileSync('gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true){console.error('GATE NOT CLEAN');process.exit(1)}console.log('CLEAN '+j.killed+'/'+j.total)"
      - name: the shipped mesh must verify against the shipped kernel
        run: |
          node -e "import('./kernel.mjs').then((k)=>{const m=JSON.parse(require('fs').readFileSync('demo/mesh.json','utf8'));const v=k.verifyMesh(m);if(!v.ok||v.valid!==true){console.error('MESH INVALID: '+v.why);process.exit(1)}console.log('mesh intact: '+m.count+' members')})"
      - name: page fixpoint — the live logic IS the gated kernel
        run: |
          node make-page.mjs
          git diff --exit-code index.html
